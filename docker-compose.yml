services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify_local
      POSTGRES_DB: eventify
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventify -d eventify']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
